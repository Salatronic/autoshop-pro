<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VIN Scanner — AutoShop Pro</title>
<!-- BarcodeDetector polyfill — enables barcode scanning on iOS Safari, Firefox, etc. -->
<script>
(function(){
  if(typeof BarcodeDetector !== 'undefined') return; // native already available
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/barcode-detector@2/dist/es2019/polyfill.min.js';
  s.onerror = function(){ window._barcodePolyfillFailed = true; };
  document.head.appendChild(s);
})();
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  height: 100dvh; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start; overflow: hidden;
}
.wrap { width: 100%; max-width: 500px; display: flex; flex-direction: column; height: 100dvh; }
.header {
  padding: 14px 16px 10px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.header h1 { font-size: 16px; font-weight: 600; }
.header small { font-size: 11px; color: rgba(255,255,255,0.4); }
.cam-wrap { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; }
#video { width: 100%; height: 100%; object-fit: cover; display: block; }
.target {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
.box {
  width: 82%; height: 64px;
  border: 2.5px solid #4a9eff; border-radius: 6px;
  box-shadow: 0 0 0 9999px rgba(0,0,0,0.42);
}
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
.status {
  padding: 14px 16px; text-align: center;
  font-size: 14px; color: rgba(255,255,255,0.75);
  line-height: 1.6; flex-shrink: 0; min-height: 72px;
}
.ok { color: #4caf7d; font-size: 18px; font-weight: 600; }
.err { color: #e05555; }
.vin-display {
  display: inline-block; background: #1a1a2e; border: 1px solid #4a9eff;
  border-radius: 4px; padding: 2px 10px; font-family: monospace;
  font-size: 15px; letter-spacing: 1px; margin-top: 4px;
}
.manual-wrap {
  padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.manual-input {
  width: 100%; max-width: 340px; padding: 10px 14px; border-radius: 6px;
  border: 1.5px solid #4a9eff; background: #1a1a1a; color: #fff;
  font-family: monospace; font-size: 16px; letter-spacing: 2px; text-transform: uppercase;
  text-align: center;
}
.manual-btn {
  padding: 10px 28px; border-radius: 6px; border: none;
  background: #4a9eff; color: #0a0a0a; font-size: 15px; font-weight: 700; cursor: pointer;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>📷 VIN Scanner</h1>
    <small>AutoShop Pro</small>
  </div>
  <div class="cam-wrap" id="cam-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="target"><div class="box" id="scan-box"></div></div>
  </div>
  <div class="status" id="status">Starting camera…</div>
  <div class="manual-wrap" id="manual-wrap" style="display:none">
    <p style="color:rgba(255,255,255,0.6);font-size:13px;text-align:center;margin:0;">Enter VIN manually and tap Send:</p>
    <input class="manual-input" id="manual-vin" placeholder="17-CHAR VIN" maxlength="20" autocomplete="off" autocorrect="off" spellcheck="false" />
    <button class="manual-btn" onclick="sendManualVin()">Send VIN</button>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const topic = params.get('topic');
const st = document.getElementById('status');
const box = document.getElementById('scan-box');

function showManualEntry(msg) {
  st.innerHTML = '<span class="err">' + msg + '</span>';
  document.getElementById('cam-wrap').style.display = 'none';
  document.getElementById('manual-wrap').style.display = 'flex';
}

async function sendManualVin() {
  const raw = (document.getElementById('manual-vin').value || '').trim().toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'');
  if(raw.length < 11) { st.innerHTML = '<span class="err">VIN too short — must be at least 11 characters.</span>'; return; }
  try {
    await fetch('https://ntfy.sh/' + topic, { method:'POST', body:raw, headers:{'Title':'VIN Scanned','Content-Type':'text/plain'} });
    st.innerHTML = '<span class="ok">✅ VIN sent to laptop!</span><br><div class="vin-display">'+raw+'</div>';
    document.getElementById('manual-wrap').style.display = 'none';
  } catch(e) {
    st.innerHTML = '<span class="err">⚠️ Could not send — check internet and retry.</span>';
  }
}

function initScanner() {
  if(typeof BarcodeDetector === 'undefined') {
    showManualEntry('⚠️ Barcode engine unavailable on this browser.<br>Use Chrome on Android for camera scan, or enter VIN below:');
    return;
  }
  let sent = false;
  let detector;
  try {
    detector = new BarcodeDetector({ formats: ['code_39', 'code_128', 'data_matrix', 'qr_code'] });
  } catch(e) {
    showManualEntry('⚠️ Detector error. Try Chrome on Android, or enter VIN below:');
    return;
  }

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
  }).then(stream => {
    const video = document.getElementById('video');
    video.srcObject = stream;
    st.textContent = 'Aim at the VIN barcode on the dashboard or door jamb';
    box.classList.add('pulse');

    let lastRaw = '', count = 0;
    const canvas = document.createElement('canvas');

    async function scan() {
      if (sent) return;
      if (video.readyState >= 2 && video.videoWidth > 0) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        try {
          const results = await detector.detect(canvas);
          for (const b of results) {
            const raw = (b.rawValue || '').trim().toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, '');
            if (raw.length >= 11) {
              if (raw === lastRaw) { count++; } else { lastRaw = raw; count = 1; }
              if (count < 2) {
                st.innerHTML = `Detected — hold steady… <div class="vin-display">${raw}</div>`;
              } else {
                sent = true;
                box.classList.remove('pulse');
                box.style.borderColor = '#4caf7d';
                stream.getTracks().forEach(t => t.stop());
                st.innerHTML = `<span class="ok">✅ VIN sent to laptop!</span><br><div class="vin-display">${raw}</div>`;
                try {
                  await fetch('https://ntfy.sh/' + topic, {
                    method: 'POST',
                    body: raw,
                    headers: { 'Title': 'VIN Scanned', 'Content-Type': 'text/plain' }
                  });
                } catch(e) {
                  st.innerHTML = '<span class="err">⚠️ Could not send — check internet connection and retry.</span>';
                  sent = false; stream.getTracks().forEach(t => t.stop());
                }
                return;
              }
            }
          }
        } catch(e2) { /* single frame errors are fine */ }
      }
      requestAnimationFrame(scan);
    }
    requestAnimationFrame(scan);

  }).catch(() => {
    showManualEntry('⚠️ Camera access denied.<br>Allow camera in your browser or enter VIN below:');
  });
}

if (!topic) {
  st.innerHTML = '<span class="err">⚠️ No session. Open this link from AutoShop Pro on the laptop (click 📱 on a VIN field).</span>';
} else {
  // Wait briefly for polyfill to load, then init
  setTimeout(function() {
    if(window._barcodePolyfillFailed && typeof BarcodeDetector === 'undefined') {
      showManualEntry('⚠️ Barcode engine failed to load.<br>Check internet or enter VIN below:');
    } else {
      initScanner();
    }
  }, 600);
}
</script>
</body>
</html>
